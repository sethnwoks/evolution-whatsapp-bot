services:
  # Evolution API Engine
  - type: web
    name: evo-engine
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_TYPE
        value: http
      - key: AUTHENTICATION_STORE_TYPE
        value: database
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: N8N_ENABLED
        value: "true"
      - key: CHATBOT_ENABLED
        value: "true"

  # Python Bot - Custom Logic Layer
  - type: web
    name: evo-bot
    runtime: docker
    dockerContext: ./bot
    dockerfilePath: bot/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: SERVER_URL
        fromService:
          name: evo-engine
          type: web
          property: host
      - key: AUTHENTICATION_API_KEY
        fromService:
          name: evo-engine
          type: web
          envVarKey: AUTHENTICATION_API_KEY
      - key: INSTANCE_NAME
        value: fire

  # n8n - Visual Workflow Engine
  - type: web
    name: n8n-brain
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: EXECUTIONS_PROCESS
        value: main
      - key: N8N_METRICS
        value: "true"
      
      # Database Configuration
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false" 
      
      # Security
      - key: N8N_ENCRYPTION_KEY
        value: "emigr8_secure_key_2025" 
      - key: WEBHOOK_URL
        fromService:
          name: n8n-brain
          type: web
          property: host
