services:
  # 1. Evolution API - The Core Engine
  - type: web
    name: evolution-api
    runtime: docker # Updated from 'env: docker' for better compatibility
    image: evoapicloud/evolution-api:latest
    plan: free
    healthCheckPath: /health
    region: frankfurt
    envVars:
      - key: SERVER_URL
        value: https://evolution-api-YOUR-RANDOM-ID.onrender.com # Update after first deploy
      - key: AUTHENTICATION_STORE_TYPE
        value: database
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution_cloud

  # 2. Python Bot Brain - Your logic
  - type: web
    name: evolution-bot
    runtime: docker
    dockerContext: ./bot
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_URL
        fromService:
          name: evolution-api
          type: web
          property: host
      - key: AUTHENTICATION_API_KEY
        fromService:
          name: evolution-api
          type: web
          property: envVar:AUTHENTICATION_API_KEY
      - key: INSTANCE_NAME
        value: fire

  # 3. Manager UI - The Dashboard
  - type: static
    name: evolution-manager
    buildCommand: ""
    publishDir: ./evolution-api/manager/dist
