services:
  # 1. Evolution API - THE ENGINE
  - type: web
    name: evolution-api
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    region: frankfurt # Lower latency for West Africa
    # NO healthCheckPath - Stops Render from killing the service during DB setup
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_STORE_TYPE
        value: database
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true

  # 2. Python Bot Brain - THE LOGIC
  - type: web
    name: evolution-bot
    runtime: docker
    rootDir: ./bot
    plan: free
    region: frankfurt # MATCHED: Must be in same region as the API
    healthCheckPath: /health # Bot starts fast, so health check is fine here
    envVars:
      - key: PORT
        value: "8000"
      - key: SERVER_URL
        fromService:
          name: evolution-api
          type: web
          property: host
      - key: AUTHENTICATION_API_KEY
        fromService:
          name: evolution-api
          type: web
          envVarKey: AUTHENTICATION_API_KEY
      - key: INSTANCE_NAME
        value: fire
