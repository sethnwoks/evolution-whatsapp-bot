services:
  # 1. Evolution API Engine - THE HEART
  - type: web
    name: evo-engine
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    region: frankfurt
    # Health check removed to allow for Supabase migrations without timeout
    envVars:
      - key: PORT # Forces Render to listen on 10000
        value: "10000"
      - key: SERVER_PORT # Forces Engine to listen on 10000
        value: "10000"
      - key: AUTHENTICATION_STORE_TYPE
        value: database
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true

  # 2. Python Bot Brain - THE LOGIC
  - type: web
    name: evo-bot
    runtime: docker
    dockerContext: ./bot
    dockerfilePath: bot/Dockerfile # FIXED: Path relative to repo root
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT # Move bot to Render's favorite port
        value: "10000"
      - key: SERVER_URL
        fromService:
          name: evo-engine
          type: web
          property: host
      - key: AUTHENTICATION_API_KEY
        fromService:
          name: evo-engine
          type: web
          envVarKey: AUTHENTICATION_API_KEY
      - key: INSTANCE_NAME
        value: fire
