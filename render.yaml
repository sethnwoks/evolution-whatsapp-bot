services:
  # 1. Evolution API - The Core Engine
  - type: web
    name: evolution-api
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    region: frankfurt
    # Health check removed for API because Render is misidentifying the port
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_STORE_TYPE
        value: database
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true

  # 2. Python Bot Brain - Your logic
  - type: web
    name: evolution-bot
    runtime: docker
    rootDir: ./bot
    plan: free
    healthCheckPath: /health # Keeping this because it's working!
    envVars:
      - key: PORT
        value: "8000"
      - key: SERVER_URL
        fromService:
          name: evolution-api
          type: web
          property: host
      - key: AUTHENTICATION_API_KEY
        fromService:
          name: evolution-api
          type: web
          envVarKey: AUTHENTICATION_API_KEY
      - key: INSTANCE_NAME
        value: fire
