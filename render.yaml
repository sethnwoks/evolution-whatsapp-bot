services:
  # 1. Evolution API Engine - THE HEART (RE-SYNC FOR SERVER_TYPE)
  - type: web
    name: evo-engine
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    region: frankfurt
    # Health check removed to allow for Supabase migrations without timeout
    envVars:
      - key: PORT
        value: "8080" # MATCHED: Dockerfile EXPOSE 8080
      - key: SERVER_PORT
        value: "8080" # MATCHED: Evolution API internal port
      - key: SERVER_TYPE
        value: http
      - key: AUTHENTICATION_STORE_TYPE
        value: database
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true

  # 2. Python Bot Brain - THE LOGIC
  - type: web
    name: evo-bot
    runtime: docker
    dockerContext: ./bot
    dockerfilePath: bot/Dockerfile # FIXED: Correct path relative to root
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000" # MATCHED: bot/Dockerfile --port 8000
      - key: SERVER_URL
        fromService:
          name: evo-engine
          type: web
          property: host
      - key: AUTHENTICATION_API_KEY
        fromService:
          name: evo-engine
          type: web
          envVarKey: AUTHENTICATION_API_KEY
      - key: INSTANCE_NAME
        value: fire

  # 3. n8n - THE VISUAL AI BRAIN
  - type: web
    name: n8n-brain
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      # --- RAM OPTIMIZATIONS (CRITICAL FOR RENDER FREE) ---
      - key: EXECUTIONS_PROCESS
        value: main
      - key: N8N_METRICS
        value: "true"
      # --- DATABASE (Use your Supabase credentials here!) ---
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        value: postgres # Update if your Supabase DB name is different
      - key: DB_POSTGRESDB_HOST
        sync: false    # Paste your Supabase host in Render Dashboard
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      # --- WEBHOOK URL ---
      - key: WEBHOOK_URL
        fromService:
          name: n8n-brain
          type: web
          property: host
